
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | GrandStay</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .reset-container {
            max-width: 420px;
            margin: 70px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        .reset-container h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .reset-container p {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        .reset-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        .reset-container button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 7px;
            background: #183b56;
            color: white;
            cursor: pointer;
        }

        .reset-container button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #resetMessage {
            margin-top: 15px;
            text-align: center;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="reset-container">

    <h2>Forgot Password?</h2>

    <p>Enter your registered email to reset your password.</p>

    <!-- Send OTP -->
    <form id="sendOtpForm">

        <input
                type="email"
                id="resetEmail"
                placeholder="Enter your email address"
                required
        >

        <button type="submit" id="sendOtpButton">
            Send OTP
        </button>

    </form>

    <!-- Reset Password -->
    <form id="resetPasswordForm" hidden>

        <input
                type="text"
                id="resetOtp"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
                pattern="[0-9]{6}"
                required
        >

        <input
                type="password"
                id="newPassword"
                placeholder="Enter new password (minimum 8 characters)"
                minlength="8"
                required
        >

        <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="8"
                required
        >

        <button type="submit" id="resetButton">
            Reset Password
        </button>

    </form>

    <div id="resetMessage"></div>

    <a href="profile.html" class="back-link">
        Back to Sign In
    </a>

</div>

<script src="forgot-password.js"></script>

</body>
</html>
